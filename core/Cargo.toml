[package]
name = "selfsign-core"
version = "1.0.0"
edition = "2024"
description = "Self-signing core for iOS 26+ on-device sideloading (Apple ID -> dev cert -> sign -> install)"

[lib]
name = "selfsign_core"
# staticlib is linked from Swift; rlib is kept for `cargo check` on the host.
crate-type = ["staticlib", "rlib"]

[features]
default = ["install"]
# `install` pulls in idevice's AFC/installation_proxy/remote_pairing/RSD stack.
install = ["isideload/install"]

[dependencies]
# Pinned to the reviewed API surface (v0.5.2). Path override is applied via
# `.cargo/config.toml` for offline builds; crates.io is used otherwise.
isideload = { version = "0.5.2", default-features = false, features = ["fs-storage", "tokio-mt"] }

# Pinned versions that match isideload 0.5.2's dependency graph.
idevice = { version = "0.1.61", default-features = false, features = [
    "ring",
    "tcp",
    "rsd",
    "afc",
    "installation_proxy",
    "remote_pairing",
    "tunnel_tcp_stack",
    "rustls",
    "xpc",
] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
