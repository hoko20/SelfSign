name: Build SelfSign IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: SelfSign
  SCHEME: SelfSign
  RUST_TARGET: aarch64-apple-ios

jobs:
  build:
    name: Build unsigned + ad-hoc signed IPA
    # iOS 26 SDK requires Xcode 26 / macOS 26 (Tahoe).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26 + install iOS platform
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | head -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          # macos-26 images may ship Xcode without the iOS platform component.
          # Install it explicitly so the deployment target (iOS 26.0) resolves.
          if ! xcodebuild -showsdks | grep -q 'iphoneos26'; then
            echo "Installing iOS 26 platform..."
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks | grep iphoneos

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Fetch isideload / idevice sources
        # core/.cargo/config.toml patches with "../../.reference", which resolves
        # relative to core/ -> one level ABOVE the repository root.
        run: |
          mkdir -p ../.reference
          git clone --depth 1 https://github.com/nab138/isideload.git ../.reference/isideload
          git clone --depth 1 https://github.com/jkcoxson/idevice.git ../.reference/idevice

      - name: Check Rust core
        working-directory: core
        run: cargo check --target ${{ env.RUST_TARGET }}

      - name: Build Rust static library (device)
        working-directory: core
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build (device, no signing)
        working-directory: ios
        run: |
          # Build directly against the iphoneos SDK. Avoid `-destination
          # generic/platform=iOS` here: the hosted runner lacks the iOS 26
          # device-support component and destination resolution fails even
          # though the SDK itself is installed.
          xcodebuild -project SelfSign.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create ad-hoc signed IPA
        working-directory: ios
        run: |
          APP=$(find build -type d -name SelfSign.app -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "SelfSign.app not found"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # Ad-hoc sign the binary + embedded frameworks so the IPA is installable
          codesign --force --deep --sign - build/Payload/SelfSign.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload SelfSign-adhoc.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfSign-adhoc
          path: ios/SelfSign-adhoc.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/SelfSign-adhoc.ipa
