name: Build SelfSign IPA (signing + LiveContainer in one app)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: SelfSign
  RUST_TARGET: aarch64-apple-ios

jobs:
  build:
    name: Build unified ad-hoc signed IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode (27 preferred, 26 fallback) + iOS platform
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | head -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | head -1)
          fi
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q 'iphoneos26'; then
            echo "Installing iOS 26 platform..."
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks | grep iphoneos

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Fetch isideload / idevice sources
        run: |
          mkdir -p ../.reference
          git clone --depth 1 https://github.com/nab138/isideload.git ../.reference/isideload
          git clone --depth 1 https://github.com/jkcoxson/idevice.git ../.reference/idevice

      - name: Check Rust core
        working-directory: core
        run: cargo check --target ${{ env.RUST_TARGET }}

      - name: Build Rust static library (device)
        working-directory: core
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Prepare LiveContainer OpenSSL dependency
        working-directory: third_party/LiveContainer
        run: sh .github/prepare_dependencies.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate unified Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build unified app (device, no signing)
        working-directory: ios
        run: |
          # One target builds the whole dependency graph: LC frameworks,
          # dylibs, extensions and the Rust-linked Swift UI framework.
          xcodebuild -project SelfSign.xcodeproj \
            -target "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create ad-hoc signed IPA
        working-directory: ios
        run: |
          APP=$(find build -type d -name SelfSign.app -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "SelfSign.app not found"; exit 1; }
          echo "Built app: $APP"
          find "$APP/Frameworks" -maxdepth 1 -mindepth 1 | sort || true
          find "$APP/PlugIns" -maxdepth 1 -mindepth 1 | sort || true
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          codesign --force --deep --sign - build/Payload/SelfSign.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload SelfSign-adhoc.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfSign-adhoc
          path: ios/SelfSign-adhoc.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/SelfSign-adhoc.ipa
